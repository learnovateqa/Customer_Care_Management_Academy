<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png?v=smile">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=smile">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Customer Care">
<title>Customer Care Level 4 · Coming soon · Elevate with Ms. Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--ink2:#46557A;--paper:#FBFAF7;--gold:#C9A24A;--a:#2A9D8F;--a-t:#E2F3F1;--b:#E76F51;--c:#6D5BD0;--d:#E9B44C}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--navy);font-family:'Poppins','Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.stripe{height:8px;background:linear-gradient(90deg,var(--a) 0 25%,var(--b) 25% 50%,var(--c) 50% 75%,var(--d) 75%)}
main{flex:1;max-width:680px;margin:0 auto;padding:64px 20px;display:grid;gap:16px;align-content:center}
.badge{justify-self:start;font-weight:700;font-size:15px;padding:4px 14px;border-radius:999px;background:var(--a-t)}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--ink2);font-size:1.05rem}
a.btn{justify-self:start;display:inline-flex;align-items:center;min-height:48px;padding:8px 20px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none;margin-top:8px}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
 <span class="badge">Level 4</span>
 <h1>Customer Care Level 4 is coming soon</h1>
 <p>The Level 4 study companion is being prepared. Level 5 learners can use their program now.</p>
 <a class="btn" href="../">Back to all programs</a>
</main>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}));</script>
</body>
</html>
