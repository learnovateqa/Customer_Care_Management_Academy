<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 12 practice quiz · Customer Care Management Level 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--ink2:#46557A;--paper:#FBFAF7;--line:#E3E6EE;--gold:#C9A24A;--a:#2A9D8F;--a-t:#E2F3F1;--b:#E76F51;--c:#6D5BD0;--d:#E9B44C;--ok:#1E7A55;--ok-t:#E3F4EC;--no:#B23A2B;--no-t:#FBE7E4}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--navy);font-family:'Poppins','Segoe UI',system-ui,sans-serif;line-height:1.6;font-size:16px}
.stripe{height:8px;background:linear-gradient(90deg,var(--a) 0 25%,var(--b) 25% 50%,var(--c) 50% 75%,var(--d) 75%)}
main{max-width:760px;margin:0 auto;padding:24px 20px 64px}
.back{display:inline-flex;min-height:44px;align-items:center;font-weight:600;color:var(--navy)}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;margin:12px 0 8px;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink2)}
.q{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.q h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
.q h2 span{display:inline-block;background:var(--a-t);border-radius:8px;padding:0 10px;margin-right:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:500 15px/1.4 'Poppins',system-ui,sans-serif;color:var(--navy);cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.right{background:var(--ok-t);border-color:var(--ok)}
.opt.wrong{background:var(--no-t);border-color:var(--no)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.right{background:var(--ok-t)}
.fb.wrong{background:var(--no-t)}
.slide{font-size:13px;color:var(--ink2);margin-top:6px}
.score{position:sticky;bottom:0;margin-top:24px;background:var(--navy);color:#fff;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{min-height:44px;padding:8px 18px;border-radius:12px;border:none;background:#fff;color:var(--navy);font:600 15px 'Poppins',system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
<a class="back" href="../index.html#/session/12">Back to Session 12</a>
<p class="muted" style="font-weight:600;margin-top:8px">Session 12 · Capstone presentations and final exam</p>
<h1>Practice quiz</h1>
<p class="muted">10 questions from the Session 12 slides and handout. Choose an answer to see if it is right. This quiz does not count toward your grade.</p>
<div id="quiz"></div>
<div class="score" aria-live="polite"><span id="scoreText">Score: 0 of 10 · 10 to go</span><button class="btn" id="reset" type="button">Start again</button></div>
</main>
<script>
const Q=[{"q": "How long is each capstone presentation?", "o": ["5 minutes", "10 minutes", "20 minutes", "30 minutes"], "a": 1, "e": "Each presentation is 10 minutes, then about 2 minutes of questions.", "s": "Handout · The 10-minute presentation"}, {"q": "What should the first minute of the presentation contain?", "o": ["The references", "Every model in the course", "The organisation and the main problem, with one number", "The AI statement"], "a": 2, "e": "Start with the organisation and the main problem, with evidence.", "s": "Handout · The 10-minute presentation"}, {"q": "Which Kotter step means “build the change into training, KPIs and normal work”?", "o": ["Make it stick", "Create urgency", "Share the vision", "Build a guiding team"], "a": 0, "e": "Make it stick: the change becomes part of normal work.", "s": "Handout · Kotter’s Steps for Change"}, {"q": "In Lewin’s model, Kotter’s steps 1 to 4 match…", "o": ["refreeze", "change", "check", "unfreeze"], "a": 3, "e": "Unfreeze → change → refreeze. Kotter’s steps 1 to 4 unfreeze, steps 5 and 6 change.", "s": "Handout · Lewin’s model"}, {"q": "A presenter gives ten recommendations with no numbers. The best feedback is…", "o": ["“Great, very complete.”", "“Choose three strong ideas and support each with data and a risk.”", "“Add more slides.”", "“Read the slides more slowly.”"], "a": 1, "e": "Fewer ideas, each with evidence and a risk, reach higher marks.", "s": "Handout · Feedback"}, {"q": "Staff say “I was the expert in the old system.” Which reason for resistance is this?", "o": ["Extra work", "Poor communication", "Loss of skills or status", "Fear of the unknown"], "a": 2, "e": "Change can take away the status that came from old skills.", "s": "Handout · Resistance to change"}, {"q": "Which risk should get an action first?", "o": ["Low likelihood, low impact", "High likelihood, high impact", "Medium likelihood, low impact", "Low likelihood, medium impact"], "a": 1, "e": "Act first on risks that are both likely and serious.", "s": "Handout · Risk"}, {"q": "A lost-baggage report is best handled by…", "o": ["a person, fast", "an FAQ page", "email only", "the chatbot with no exit"], "a": 0, "e": "Urgent, stressful problems need a person, fast (Chapter 8).", "s": "Revision toolkit · Channel Strategy"}, {"q": "$50 per visit, 52 visits a year, 4 years. What is the CLV?", "o": ["$2,600", "$10,400", "$208", "$5,200"], "a": 1, "e": "CLV = 50 × 52 × 4 = $10,400.", "s": "Revision toolkit · Key formulas"}, {"q": "What does the capstone report need besides about 1,500 words?", "o": ["A video", "Sources and an AI statement", "At least 20 slides", "A signed letter from the employer"], "a": 1, "e": "The final checklist: sources and an AI statement.", "s": "Handout · Capstone step 12: final checklist"}];
let answered={};
function render(){const box=document.getElementById("quiz");box.innerHTML="";answered={};
Q.forEach((it,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML=`<h2><span>${i+1}</span>${it.q}</h2><div class="opts" role="group" aria-label="Question ${i+1} options"></div><div class="fb" hidden aria-live="polite"></div>`;
const opts=d.querySelector(".opts"),fb=d.querySelector(".fb");
it.o.forEach((t,j)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=t;
b.addEventListener("click",()=>{if(i in answered)return;answered[i]=j===it.a;
opts.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add("right")});
if(j!==it.a)b.classList.add("wrong");
fb.hidden=false;fb.className="fb "+(j===it.a?"right":"wrong");
fb.innerHTML=`<b>${j===it.a?"Correct.":"Not quite."}</b> ${it.e}<div class="slide">Review: ${it.s}</div>`;score()});
opts.appendChild(b)});box.appendChild(d)});score()}
function score(){const n=Object.keys(answered).length,c=Object.values(answered).filter(Boolean).length;
if(n===Q.length){try{const k="ccl5-quiz-w12",o=JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify({best:Math.max(c,o?o.best:0),last:c,total:Q.length}))}catch(e){}}
if(n===Q.length){try{const au=JSON.parse(localStorage.getItem("ccl5-auth")||"null");if(au&&au.code){fetch("https://script.google.com/macros/s/AKfycbwXO14ta925OHJMk9qjt3yT44cCfflZo62fEWj_v4rR8z_xDrgOOCvZbc5uMVwiSjhkaA/exec",{method:"POST",body:JSON.stringify({action:"score",code:au.code,level:"5",session:12,score:c,total:Q.length})}).catch(()=>{})}}catch(e){}}
document.getElementById("scoreText").textContent=n<Q.length?`Score: ${c} of ${Q.length} · ${Q.length-n} to go`:`Finished: ${c} of ${Q.length}. ${c>=8?"Well prepared for the exam.":"Review the handout pages shown, then try again."}`}
document.getElementById("reset").addEventListener("click",()=>{render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
