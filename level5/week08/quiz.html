<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 8 practice quiz · Customer Care Management Level 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--ink2:#46557A;--paper:#FBFAF7;--line:#E3E6EE;--gold:#C9A24A;--a:#2A9D8F;--a-t:#E2F3F1;--b:#E76F51;--c:#6D5BD0;--d:#E9B44C;--ok:#1E7A55;--ok-t:#E3F4EC;--no:#B23A2B;--no-t:#FBE7E4}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--navy);font-family:'Poppins','Segoe UI',system-ui,sans-serif;line-height:1.6;font-size:16px}
.stripe{height:8px;background:linear-gradient(90deg,var(--a) 0 25%,var(--b) 25% 50%,var(--c) 50% 75%,var(--d) 75%)}
main{max-width:760px;margin:0 auto;padding:24px 20px 64px}
.back{display:inline-flex;min-height:44px;align-items:center;font-weight:600;color:var(--navy)}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;margin:12px 0 8px;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink2)}
.q{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.q h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
.q h2 span{display:inline-block;background:var(--a-t);border-radius:8px;padding:0 10px;margin-right:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:500 15px/1.4 'Poppins',system-ui,sans-serif;color:var(--navy);cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.right{background:var(--ok-t);border-color:var(--ok)}
.opt.wrong{background:var(--no-t);border-color:var(--no)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.right{background:var(--ok-t)}
.fb.wrong{background:var(--no-t)}
.slide{font-size:13px;color:var(--ink2);margin-top:6px}
.score{position:sticky;bottom:0;margin-top:24px;background:var(--navy);color:#fff;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{min-height:44px;padding:8px 18px;border-radius:12px;border:none;background:#fff;color:var(--navy);font:600 15px 'Poppins',system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
<a class="back" href="../index.html#/session/8">Back to Session 8</a>
<p class="muted" style="font-weight:600;margin-top:8px">Session 8 · Communication barriers</p>
<h1>Practice quiz</h1>
<p class="muted">10 questions from the Session 8 slides and handout. Choose an answer to see if it is right. This quiz does not count toward your grade.</p>
<div id="quiz"></div>
<div class="score" aria-live="polite"><span id="scoreText">Score: 0 of 10 · 10 to go</span><button class="btn" id="reset" type="button">Start again</button></div>
</main>
<script>
const Q=[{"q": "A guest expects formal respect and asks for the most senior person. This shows high…", "o": ["Individualism", "Power distance", "Uncertainty avoidance", "Short-term orientation"], "a": 1, "e": "Power distance is how much people expect formal respect and different status.", "s": "Handout · Hofstede’s dimensions"}, {"q": "Hofstede’s original research studied employees of…", "o": ["IBM", "Toyota", "McDonald’s", "Qatar Airways"], "a": 0, "e": "He studied about 116,000 questionnaires from IBM staff in more than 50 countries.", "s": "Handout · Where Hofstede’s ideas began"}, {"q": "“Your SIM needs a PUK reset” is an example of…", "o": ["Noise", "Jargon", "Emotion", "Culture"], "a": 1, "e": "Jargon is special business language customers may not know. Explain it in everyday words.", "s": "Handout · Barriers"}, {"q": "Why did McDonald’s create the McArabia?", "o": ["To lower prices", "To close stores", "To match local tastes and culture", "To replace the Big Mac"], "a": 2, "e": "The brand stays the same, but the menu adapts to each culture.", "s": "Handout · Brand spotlight"}, {"q": "The best way to use cultural dimensions is to…", "o": ["Treat everyone from a country the same", "Prepare and observe, then treat each person as an individual", "Ignore culture completely", "Ask customers their nationality first"], "a": 1, "e": "The dimensions describe groups, not individuals. Use them to prepare, not to label.", "s": "Handout · The warning"}, {"q": "An angry customer cannot hear your solution. What should you do first?", "o": ["Explain the policy again, louder", "Listen and calm the customer, then explain", "Pass them to another team", "Send an email instead"], "a": 1, "e": "Emotion is a barrier. Listen and calm first, then explain.", "s": "Handout · Barriers"}, {"q": "“So your order arrived without the charger.” This active-listening skill is…", "o": ["Paraphrasing", "Summarising", "Reflecting feelings", "Asking an open question"], "a": 0, "e": "Paraphrasing says the message in your own words to check you understood.", "s": "Handout · Active listening"}, {"q": "In a high-context culture, meaning is mostly in…", "o": ["The exact words", "The situation, relationship and tone", "Written contracts only", "Numbers"], "a": 1, "e": "High-context communication relies on relationships and tone; answers may be indirect (Hall, 1976).", "s": "Handout · High- and low-context"}, {"q": "What is a risk of translation tools?", "o": ["They are always slow", "They can make mistakes with tone, idioms and important details", "They only work in English", "They cost more than staff"], "a": 1, "e": "Use simple sentences and have a person check legal or medical messages.", "s": "Handout · Tech layer"}, {"q": "Which is good practice for vulnerable customers?", "o": ["One channel only", "Rush them to save time", "More than one channel, extra time and checking understanding", "Avoid talking about their situation"], "a": 2, "e": "Offer several channels, give extra time, check understanding and treat people with respect.", "s": "Handout · Serving vulnerable customers"}];
let answered={};
function render(){const box=document.getElementById("quiz");box.innerHTML="";answered={};
Q.forEach((it,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML=`<h2><span>${i+1}</span>${it.q}</h2><div class="opts" role="group" aria-label="Question ${i+1} options"></div><div class="fb" hidden aria-live="polite"></div>`;
const opts=d.querySelector(".opts"),fb=d.querySelector(".fb");
it.o.forEach((t,j)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=t;
b.addEventListener("click",()=>{if(i in answered)return;answered[i]=j===it.a;
opts.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add("right")});
if(j!==it.a)b.classList.add("wrong");
fb.hidden=false;fb.className="fb "+(j===it.a?"right":"wrong");
fb.innerHTML=`<b>${j===it.a?"Correct.":"Not quite."}</b> ${it.e}<div class="slide">Review: ${it.s}</div>`;score()});
opts.appendChild(b)});box.appendChild(d)});score()}
function score(){const n=Object.keys(answered).length,c=Object.values(answered).filter(Boolean).length;
if(n===Q.length){try{const k="ccl5-quiz-w8",o=JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify({best:Math.max(c,o?o.best:0),last:c,total:Q.length}))}catch(e){}}
if(n===Q.length){try{const au=JSON.parse(localStorage.getItem("ccl5-auth")||"null");if(au&&au.code){fetch("https://script.google.com/macros/s/AKfycbwXO14ta925OHJMk9qjt3yT44cCfflZo62fEWj_v4rR8z_xDrgOOCvZbc5uMVwiSjhkaA/exec",{method:"POST",body:JSON.stringify({action:"score",code:au.code,level:"5",session:8,score:c,total:Q.length})}).catch(()=>{})}}catch(e){}}
document.getElementById("scoreText").textContent=n<Q.length?`Score: ${c} of ${Q.length} · ${Q.length-n} to go`:`Finished: ${c} of ${Q.length}. ${c>=8?"Well prepared for the exit ticket.":"Review the handout pages shown, then try again."}`}
document.getElementById("reset").addEventListener("click",()=>{render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
