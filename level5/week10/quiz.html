<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 10 practice quiz · Customer Care Management Level 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--ink2:#46557A;--paper:#FBFAF7;--line:#E3E6EE;--gold:#C9A24A;--a:#2A9D8F;--a-t:#E2F3F1;--b:#E76F51;--c:#6D5BD0;--d:#E9B44C;--ok:#1E7A55;--ok-t:#E3F4EC;--no:#B23A2B;--no-t:#FBE7E4}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--navy);font-family:'Poppins','Segoe UI',system-ui,sans-serif;line-height:1.6;font-size:16px}
.stripe{height:8px;background:linear-gradient(90deg,var(--a) 0 25%,var(--b) 25% 50%,var(--c) 50% 75%,var(--d) 75%)}
main{max-width:760px;margin:0 auto;padding:24px 20px 64px}
.back{display:inline-flex;min-height:44px;align-items:center;font-weight:600;color:var(--navy)}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;margin:12px 0 8px;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink2)}
.q{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.q h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
.q h2 span{display:inline-block;background:var(--a-t);border-radius:8px;padding:0 10px;margin-right:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:500 15px/1.4 'Poppins',system-ui,sans-serif;color:var(--navy);cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.right{background:var(--ok-t);border-color:var(--ok)}
.opt.wrong{background:var(--no-t);border-color:var(--no)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.right{background:var(--ok-t)}
.fb.wrong{background:var(--no-t)}
.slide{font-size:13px;color:var(--ink2);margin-top:6px}
.score{position:sticky;bottom:0;margin-top:24px;background:var(--navy);color:#fff;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{min-height:44px;padding:8px 18px;border-radius:12px;border:none;background:#fff;color:var(--navy);font:600 15px 'Poppins',system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
<a class="back" href="../index.html#/session/10">Back to Session 10</a>
<p class="muted" style="font-weight:600;margin-top:8px">Session 10 · Complaints and quality improvement</p>
<h1>Practice quiz</h1>
<p class="muted">10 questions from the Session 10 slides and handout. Choose an answer to see if it is right. This quiz does not count toward your grade.</p>
<div id="quiz"></div>
<div class="score" aria-live="polite"><span id="scoreText">Score: 0 of 10 · 10 to go</span><button class="btn" id="reset" type="button">Start again</button></div>
</main>
<script>
const Q=[{"q": "What does the A in LEARN stand for?", "o": ["Act", "Apologise", "Agree", "Ask"], "a": 1, "e": "Listen, Empathise, Apologise, Resolve, Notify and follow up.", "s": "Handout · LEARN"}, {"q": "Why did “United Breaks Guitars” become famous?", "o": ["The guitar was very expensive", "The airline replied quickly", "A small complaint was handled badly and shared on social media", "The song won an award"], "a": 2, "e": "Poor recovery turned one complaint into millions of views.", "s": "Handout · When recovery fails"}, {"q": "The 5 Whys method comes from…", "o": ["Disney", "Starbucks", "Toyota", "Domino’s"], "a": 2, "e": "Taiichi Ohno described asking “why?” at Toyota.", "s": "Handout · 5 Whys"}, {"q": "In PDCA, what happens in “Check”?", "o": ["You plan the change", "You compare results before and after", "You make it standard", "You try it in one area"], "a": 1, "e": "Check means measuring whether the change worked.", "s": "Handout · PDCA"}, {"q": "The Service Recovery Paradox says that…", "o": ["Excellent recovery can make customers more loyal than before", "Complaints always reduce loyalty", "Refunds are always enough", "Customers never forgive failures"], "a": 0, "e": "It only works when recovery is fast, fair and personal, and the problem does not happen again.", "s": "Handout · Service Recovery Paradox"}, {"q": "Most unhappy customers…", "o": ["Always complain", "Never complain; they leave and tell others", "Write to the manager", "Ask for a refund"], "a": 1, "e": "That is why a complaint is free advice: make complaining easy.", "s": "Handout · Core idea"}, {"q": "A refund was fair, but the staff member was rude. Which justice is missing?", "o": ["Outcome justice", "Procedural justice", "Interactional justice", "None"], "a": 2, "e": "Interactional justice is about being treated politely, honestly and with care.", "s": "Handout · Three kinds of justice"}, {"q": "Starbucks trains staff with…", "o": ["LATTE", "PDCA", "RACI", "SMART"], "a": 0, "e": "LATTE: Listen, Acknowledge, Take action, Thank, Explain.", "s": "Handout · Starbucks LATTE"}, {"q": "How quickly should you reply to a public online review?", "o": ["Within a month", "Within 24 to 48 hours", "Never", "Only if it is positive"], "a": 1, "e": "Thank, apologise, then move to a private channel.", "s": "Handout · Replying to public reviews"}, {"q": "Which is a customer care charter promise, not a policy rule?", "o": ["Staff may refund up to QAR 100 without approval", "Complaints are recorded in the CRM", "“We answer WhatsApp messages within 1 hour, 9 am to 9 pm.”", "Managers review complaints monthly"], "a": 2, "e": "A charter is short and public: clear promises to customers.", "s": "Handout · Policy and charter"}];
let answered={};
function render(){const box=document.getElementById("quiz");box.innerHTML="";answered={};
Q.forEach((it,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML=`<h2><span>${i+1}</span>${it.q}</h2><div class="opts" role="group" aria-label="Question ${i+1} options"></div><div class="fb" hidden aria-live="polite"></div>`;
const opts=d.querySelector(".opts"),fb=d.querySelector(".fb");
it.o.forEach((t,j)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=t;
b.addEventListener("click",()=>{if(i in answered)return;answered[i]=j===it.a;
opts.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add("right")});
if(j!==it.a)b.classList.add("wrong");
fb.hidden=false;fb.className="fb "+(j===it.a?"right":"wrong");
fb.innerHTML=`<b>${j===it.a?"Correct.":"Not quite."}</b> ${it.e}<div class="slide">Review: ${it.s}</div>`;score()});
opts.appendChild(b)});box.appendChild(d)});score()}
function score(){const n=Object.keys(answered).length,c=Object.values(answered).filter(Boolean).length;
if(n===Q.length){try{const k="ccl5-quiz-w10",o=JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify({best:Math.max(c,o?o.best:0),last:c,total:Q.length}))}catch(e){}}
if(n===Q.length){try{const au=JSON.parse(localStorage.getItem("ccl5-auth")||"null");if(au&&au.code){fetch("https://script.google.com/macros/s/AKfycbwXO14ta925OHJMk9qjt3yT44cCfflZo62fEWj_v4rR8z_xDrgOOCvZbc5uMVwiSjhkaA/exec",{method:"POST",body:JSON.stringify({action:"score",code:au.code,level:"5",session:10,score:c,total:Q.length})}).catch(()=>{})}}catch(e){}}
document.getElementById("scoreText").textContent=n<Q.length?`Score: ${c} of ${Q.length} · ${Q.length-n} to go`:`Finished: ${c} of ${Q.length}. ${c>=8?"Well prepared for the exit ticket.":"Review the handout pages shown, then try again."}`}
document.getElementById("reset").addEventListener("click",()=>{render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
